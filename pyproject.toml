[project]
name = "petnetizen-ble"
version = "2.0.0"
description = "Home Assistant integration for Pet Netizen BLE feeders (HACS)"
readme = "README.md"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    # Home Assistant test harness (pins homeassistant==2026.10.4).
    "pytest-homeassistant-custom-component==0.13.375",
    # Integration requirement (manifest.json) and HA bluetooth component
    # requirements at 2026.10.4, which homeassistant itself does not install.
    "petnetizen-feeder>=0.10.0",
    "bleak==3.0.2",
    "bleak-retry-connector==4.7.1",
    "bluetooth-adapters==2.4.0",
    "bluetooth-auto-recovery==1.6.4",
    "bluetooth-data-tools==1.29.24",
    "dbus-fast==5.0.22",
    "habluetooth==7.1.2",
    # usb component (a bluetooth dependency) requirements at 2026.10.4.
    "aiousbwatcher==1.1.2",
    "serialx==1.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
