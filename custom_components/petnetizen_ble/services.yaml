set_feeding:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: petnetizen_ble
    time:
      required: true
      selector:
        time:
    weekdays:
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          translation_key: weekday
          options: [mon, tue, wed, thu, fri, sat, sun]
    portions:
      default: 1
      selector:
        number:
          min: 1
          max: 15
          mode: box
    enabled:
      default: true
      selector:
        boolean:

remove_feeding:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: petnetizen_ble
    time:
      required: true
      selector:
        time:

set_feeding_schedule:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: petnetizen_ble
    schedule:
      required: true
      example: '[{"time": "08:00", "weekdays": ["mon", "fri"], "portions": 2}]'
      selector:
        object:

set_feed_plan:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: petnetizen_ble
    schedule:
      required: true
      selector:
        object:
